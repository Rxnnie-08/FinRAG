[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Financial Document Intelligence: a RAG-based question-answering system with source attribution over SEC filings"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "flask>=3.0",
  "qdrant-client>=1.9",   # vector database (dense retrieval)
  "dspy>=2.6",            # prompt program + optimiser for the answer step
]

[project.optional-dependencies]
st = ["sentence-transformers>=2.7"]     # neural dense embeddings (BAAI/bge-*, e5-*)
anthropic = ["anthropic>=0.40"]         # Claude as generator / rewriter / judge
pdf = ["pypdf>=4.0"]                    # PDF ingestion (needed for FinanceBench PDFs)
dev = ["pytest>=8.0"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finrag.server" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
